name: Build and publish mod manager

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test automation module contracts
        run: node --test tests/automation-mods.test.mjs

      - name: Test complete Windows solution
        if: runner.os == 'Windows'
        run: dotnet test ScrapMechanicModManager.sln -c Release

      - name: Test shared Core on Linux
        if: runner.os == 'Linux'
        run: dotnet test tests/ScrapMechanicModManager.Tests/ScrapMechanicModManager.Tests.csproj -c Release

      - name: Build Avalonia Linux frontend
        if: runner.os == 'Linux'
        run: dotnet build src/ScrapMechanicModManager.Desktop/ScrapMechanicModManager.Desktop.csproj -c Release

  build-windows:
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows launcher
        run: >-
          dotnet publish src/ScrapMechanicModManager/ScrapMechanicModManager.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/windows

      - name: Upload Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: artifacts/windows/ScrapMechanicModManager.exe
          if-no-files-found: error

  build-linux:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained Avalonia launcher
        run: >-
          dotnet publish src/ScrapMechanicModManager.Desktop/ScrapMechanicModManager.Desktop.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/linux-publish

      - name: Build Linux release archive
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart('v')
          } else {
            "0.0.0-ci"
          }
          ./scripts/New-LinuxReleasePackage.ps1 `
            -Version $version `
            -PublishDirectory artifacts/linux-publish `
            -OutputDirectory artifacts/linux-release

      - name: Upload Linux launcher
        uses: actions/upload-artifact@v4
        with:
          name: linux-launcher
          path: artifacts/linux-release/ScrapMechanicModManager-linux-x64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download launcher artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/download

      - name: Build release manifest and payload
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/New-ReleasePayload.ps1 `
            -Version $version `
            -OutputDirectory artifacts/release

      - name: Prepare versioned Windows launcher
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Path artifacts/release-windows -Force | Out-Null
          Copy-Item `
            artifacts/download/windows-launcher/ScrapMechanicModManager.exe `
            "artifacts/release-windows/ScrapMechanicModManager-$version.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/download/windows-launcher/ScrapMechanicModManager.exe
            artifacts/release-windows/ScrapMechanicModManager-*.exe
            artifacts/download/linux-launcher/ScrapMechanicModManager-linux-x64.tar.gz
            artifacts/release/modules.json
            artifacts/release/manifest.json
            artifacts/release/robots_01.zip
            artifacts/release/manifest-beehive-automation.json
            artifacts/release/beehive-automation.zip
            artifacts/release/manifest-freezer-automation.json
            artifacts/release/freezer-automation.zip
